<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的霸王茶姬杯贴</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; background:linear-gradient(160deg,#f3ecdd,#e7dcc4); display:flex; flex-direction:column; align-items:center; padding:24px 16px 40px; font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif; }
  h1 { color:#3a5c3e; font-size:20px; margin:8px 0 4px; }
  p.sub { color:#8a7a5c; font-size:13px; margin-bottom:20px; }
  .card { background:#fff; border-radius:24px; box-shadow:0 12px 40px rgba(120,92,58,.22); padding:14px; max-width:420px; width:100%; }
  .card img { width:100%; display:block; border-radius:14px; }
  .actions { margin-top:22px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  button { border:none; border-radius:14px; padding:13px 22px; font-size:15px; cursor:pointer; font-weight:600; }
  .primary { background:#3a5c3e; color:#fff; }
  .ghost { background:#fff; color:#3a5c3e; border:1px solid #3a5c3e; }
  .tip { margin-top:18px; font-size:12px; color:#9a8a6a; text-align:center; line-height:1.7; max-width:340px; }
</style>
</head>
<body>
  <h1>🍵 我的专属杯贴</h1>
  <p class="sub">玫瑰刺破掌心 · 循着狐狸走向落日</p>
  <div class="card"><img id="sticker" src="__IMG_B64__" alt="霸王茶姬杯贴"></div>
  <div class="actions">
    <button class="primary" onclick="downloadImg()">保存杯贴</button>
    <button class="ghost" onclick="sharePage()">分享给好友</button>
  </div>
  <p class="tip">长按图片即可保存到相册；点开链接即可查看这张杯贴。</p>
<script>
  const src = document.getElementById('sticker').src;
  function downloadImg() {
    const a=document.createElement('a'); a.href=src; a.download='霸王茶姬杯贴.jpg'; a.click();
  }
  function sharePage() {
    if (navigator.share) { navigator.share({title:'我的霸王茶姬杯贴', text:'玫瑰刺破掌心 · 循着狐狸走向落日', url:location.href}).catch(()=>{}); }
    else { prompt('复制链接发给好友：', location.href); }
  }
</script>
</body>
</html>
